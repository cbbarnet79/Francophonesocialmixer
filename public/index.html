<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f4eb">
<title>Francophone Social Mixer</title>
<link rel="stylesheet" href="./styles.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<div class="layout">
<aside>
  <div class="brand"><span class="logo" aria-hidden="true">✳</span> Tennessee Language Center</div>
  <div class="illustration" aria-hidden="true"><span>Bonjour !</span><span>Et vous ?</span><i>✦</i></div>
  <nav aria-label="Activity progress"><ol id="progress"></ol></nav>
</aside>
<main id="main">
  <header><span>French Beginner 1</span><button id="restart" class="quiet" type="button" hidden>Start over</button></header>
  <section id="screen" tabindex="-1"></section>
  <p id="status" role="status" aria-live="polite"></p>
</main>
</div>
</body>
</html>
